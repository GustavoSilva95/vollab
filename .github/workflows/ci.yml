# CI do VolLab (PRD §10.4). Nenhum job acessa B3, BCB ou Yahoo: fontes externas são fixtures.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.9"

jobs:
  web-lint-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  web-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  engine-lint-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  engine-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vollab
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: vollab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vollab -d vollab_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vollab:ci-only@127.0.0.1:5432/vollab_test
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked
      # Inclui os T-REF (marcador `reference`) à medida que forem criados.
      - run: uv run pytest

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: npm ci
      - run: (cd services/engine && uv sync --locked)
      - run: npm run contract:check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sobe postgres + engine com a fonte simulada (compose + override do E2E)
        run: |
          cp .env.example .env
          ENGINE_VERSION=${GITHUB_SHA::7} docker compose -p vollab-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
      - run: npm run e2e
        env:
          CI: "true"
      - name: Logs do compose em caso de falha
        if: failure()
        run: docker compose -p vollab-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
